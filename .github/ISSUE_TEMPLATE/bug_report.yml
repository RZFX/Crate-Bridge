name: Bug report
description: Something didn't work. Crate Bridge is vibe-coded, so this is expected sometimes — thank you for telling us.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach your music files or your whole library.** Playlist and track names are fine; please remove anything private.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options: [Restore playlists, Library diff, Serato → Rekordbox, Duplicates, Missing files, Keys, The page / launcher, Not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Chose the USB…\n2. Ticked 'Embed cues'…"
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15
  - type: input
    id: versions
    attributes:
      label: Rekordbox / Serato versions
  - type: textarea
    id: console
    attributes:
      label: Browser console errors (optional)
      description: Open DevTools (F12) → Console and paste any red errors.
      render: text
